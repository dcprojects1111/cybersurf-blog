<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% if page.title %}{{ page.title }} — {% endif %}CyberSurf Blog</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>

  {% if page.layout == "post" %}
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{ page.title | escape }}" />
  <meta property="og:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}" />{% endif %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | jsonify }},
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.date | date_to_xmlschema }}",
    "url": "{{ page.url | absolute_url }}",
    {% if page.image %}"image": "{{ page.image | absolute_url }}",{% endif %}
    "author": { "@type": "Person", "name": "Darryl Wessling" },
    "publisher": { "@type": "Organization", "name": "CyberSurf", "url": "https://cybersurf.au/" },
    "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ page.url | absolute_url }}" }
  }
  </script>
  {% else %}
  <meta name="description" content="{{ site.description }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  {% endif %}

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Roboto',sans-serif;background:linear-gradient(160deg,#0a1628 0%,#0d2240 100%);min-height:100vh;padding:40px 20px;}
    nav{display:flex;align-items:center;justify-content:space-between;max-width:800px;margin:0 auto 40px;}
    .brand{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;color:#fff;text-decoration:none;}
    .brand span{color:#00d2ff;}
    .nav-link{font-size:13px;color:rgba(252,253,242,.4);text-decoration:none;border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:6px;}
    .nav-link:hover{color:#00d2ff;border-color:#00d2ff;}
    footer{text-align:center;max-width:800px;margin:40px auto 0;font-size:12px;color:rgba(252,253,242,.25);}
    footer a{color:rgba(0,210,255,.5);text-decoration:none;}
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">Cyber<span>Surf</span> Blog</a>
    <div style="display:flex;gap:10px;">
      <a href="/subscribe/" class="nav-link">Subscribe</a>
      <a href="https://cybersurf.au" class="nav-link">CyberSurf.au &rarr;</a>
    </div>
  </nav>
  {{ content }}
  <footer>&copy; 2026 CyberSurf &nbsp;&middot;&nbsp; <a href="https://cybersurf.au">cybersurf.au</a></footer>
</body>
</html>
